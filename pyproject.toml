[project]
name = "german-credit"
version = "0.1.0"
description = "Case study for data science using a famous dataset"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "polars>=1.44.1",
    "pydantic>=2.13.5",
    "scikit-learn>=1.9.0",
]

[project.scripts]
german-credit = "german_credit:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.1",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
    "seaborn>=0.13.2",
]
